name: E2E,Docker Image CI - main

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_URL: jdbc:postgresql://localhost:5432/app_test
      DB_USERNAME: app
      DB_PASSWORD: password
      JWT_SECRET_BASE64: ohjosdfhsofOPsaofhwpjNOFIAHWFP90285984nsvlksnvplng20sdfknPONENFLSDNF23452n5wpp
      BE_IMAGE: docker.io/iamyasuomain/deawkoikid_backend:latest
      BE_PORT: 8080

      CYPRESS_BASE_URL: http://localhost:3000
      CI: "true"

    steps:
      - name: Checkout FE
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wait for backend health
        run: |
          echo "Waiting for backend health..."
          for i in {1..30}; do
            if curl -fsS http://localhost:${BE_PORT}/health > /dev/null; then
              echo "✅ Backend is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            docker logs be | tail -n 20
            sleep 2
          done

      - name: Pull & run backend container
        run: |
          docker pull "$BE_IMAGE"
          docker run -d --name be \
            -p ${BE_PORT}:8080 \
            --env SPRING_PROFILES_ACTIVE=test \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app_test \
            --env SPRING_DATASOURCE_USERNAME=app \
            --env SPRING_DATASOURCE_PASSWORD=password \
            --env JWT_SECRET_BASE64=ohjosdfhsofOPsaofhwpjNOFIAHWFP90285984nsvlksnvplng20sdfknPONENFLSDNF23452n5wpp \
            "$BE_IMAGE"
            echo "Waiting for backend..."
            for i in {1..15}; do
              if curl -fsS http://localhost:${BE_PORT}/health > /dev/null; then
                echo "Backend is ready"
                break
              fi
              echo "Waiting... ($i/15)"
              docker logs be
              sleep 2
              done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      
      - name: Install deps
        run: pnpm install --frozen-lockfile
        
      - name: Start frontend
        run: pnpm dev &
        env:
          NODE_ENV: test
          
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000
        
      - name: Run Cypress E2E
        run: pnpm dlx cypress run --config baseUrl=${CYPRESS_BASE_URL}

      - name: Generate version tag
        id: tag
        run: echo "TAG=$(date +'%Y$m$d-%H%M')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build frontend Docker image
        run: docker build -t iamyasuomain/deawkoikid_frontend:${{ env.TAG }} -t iamyasuomain/deawkoikid_frontend:latest .

      - name: Push frontend Docker image
        run: |
          docker push iamyasuomain/deawkoikid_frontend:${{ env.TAG }}
          docker push iamyasuomain/deawkoikid_frontend:latest
          echo "✅ Pushed iamyasuomain/deawkoikid_frontend:${{ env.TAG }}"
