name: E2E,Docker Image CI - main

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_URL: jdbc:postgresql://postgres:5432/app_test
      DB_USERNAME: app
      DB_PASSWORD: password
      JWT_SECRET_BASE64: ohjosdfhsofOPsaofhwpjNOFIAHWFP90285984nsvlksnvplng20sdfknPONENFLSDNF23452n5wpp
      BE_IMAGE: docker.io/iamyasuomain/deawkoikid_backend:latest
      BE_PORT: 8080

      CYPRESS_BASE_URL: http://localhost:3000/fivetuay10bath-frontend
      CI: "true"

    steps:
      - name: Checkout FE
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull & run backend container
        run: |
          docker pull "$BE_IMAGE"
          
          # Find the network that postgres service is running on
          POSTGRES_CONTAINER_ID=$(docker ps --filter "ancestor=postgres:17" --format "{{.ID}}")
          echo "PostgreSQL container ID: $POSTGRES_CONTAINER_ID"
          
          if [ -n "$POSTGRES_CONTAINER_ID" ]; then
            POSTGRES_NETWORK=$(docker inspect $POSTGRES_CONTAINER_ID --format='{{range $net,$v := .NetworkSettings.Networks}}{{$net}}{{end}}')
            echo "PostgreSQL network: $POSTGRES_NETWORK"
            
            # Run backend in the same network as postgres
            docker run -d --name be \
              --network "$POSTGRES_NETWORK" \
              -p ${BE_PORT}:8080 \
              --env SPRING_PROFILES_ACTIVE=test \
              --env SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app_test \
              --env SPRING_DATASOURCE_USERNAME=app \
              --env SPRING_DATASOURCE_PASSWORD=password \
              --env JWT_SECRET_BASE64=${{ env.JWT_SECRET_BASE64 }} \
              --env LOGGING_LEVEL_ROOT=INFO \
              --env LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=INFO \
              "$BE_IMAGE"
          else
            echo "❌ PostgreSQL container not found!"
            exit 1
          fi
          
          # Wait a bit for container to start
          sleep 3
          
          # Check if backend container is running
          if ! docker ps | grep -q "be"; then
            echo "❌ Backend container failed to start!"
            docker logs be
            exit 1
          fi
          
          echo "✅ Backend container started"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          SUCCESS=false
          
          for i in {1..60}; do
            echo "Attempt $i/60..."
            
            # Check if container is still running
            if ! docker ps | grep -q "be"; then
              echo "❌ Backend container stopped!"
              echo "=== Backend logs ==="
              docker logs be
              exit 1
            fi
            
            # Check if backend port is responding (any response = backend is up)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/login \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"email":"test","password":"test"}' 2>&1 || echo "000")
            
            echo "HTTP response code: $HTTP_CODE"
            
            # Any HTTP response (even 401/404/500) means backend is running
            if [ "$HTTP_CODE" != "000" ] && [ "$HTTP_CODE" != "Connection refused" ]; then
              echo "✅ Backend is responding! (HTTP $HTTP_CODE)"
              SUCCESS=true
              break
            fi
            
            # Show logs every 10 attempts
            if [ $((i % 10)) -eq 0 ]; then
              echo "Backend logs (last 20 lines):"
              docker logs be --tail 20
            fi
            
            sleep 2
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Backend failed to respond after 120 seconds"
            echo ""
            echo "=== Full backend logs ==="
            docker logs be
            echo ""
            echo "=== Container status ==="
            docker ps -a | grep be
            echo ""
            echo "=== Network info ==="
            docker inspect be --format='{{range $net,$v := .NetworkSettings.Networks}}{{$net}} {{end}}'
            exit 1
          fi
          
          # Test actual API endpoint
          echo ""
          echo "Testing API endpoint with valid credentials..."
          curl -v http://localhost:8080/api/auth/login -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@apt.com","password":"admin"}' || echo "API test completed"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Start frontend
        run: pnpm dev &
        env:
          NODE_ENV: test
          VITE_DEAWKOIKID_API_BASE_URL: http://localhost:8080

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure Cypress binary installed
        run: pnpm dlx cypress install

      - name: Run Cypress E2E
        run: pnpm dlx cypress run --config baseUrl=http://localhost:3000/fivetuay10bath-frontend
        env:
          CYPRESS_BASE_URL: http://localhost:3000/fivetuay10bath-frontend
          CYPRESS_API_BASE_URL: http://localhost:8080

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Generate version tag
        id: tag
        run: echo "TAG=$(date +'%Y$m$d-%H%M')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build frontend Docker image
        run: docker build -t iamyasuomain/deawkoikid_frontend:${{ env.TAG }} -t iamyasuomain/deawkoikid_frontend:latest .

      - name: Push frontend Docker image
        run: |
          docker push iamyasuomain/deawkoikid_frontend:${{ env.TAG }}
          docker push iamyasuomain/deawkoikid_frontend:latest
          echo "Pushed! iamyasuomain/deawkoikid_frontend:${{ env.TAG }}"
  deploy:
    needs: e2e
    uses: 5tuay10bath/Deployment/.github/workflows/main.yml@main
    with:
      source_repo: 5tuay10bath/deawkoikid-fe
