apiVersion: v1
kind: Service
metadata:
  name: deawkoikid-be
  namespace: deawkoikid
spec:
  selector:
    app: deawkoikid-be
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deawkoikid-be
  namespace: deawkoikid
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: deawkoikid-be
  template:
    metadata:
      labels:
        app: deawkoikid-be
    spec:
      containers:
        - name: app
          image: iamyasuomain/deawkoikid_backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: deawkoikid-env-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://database:5432/deawkoikid
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: deawkoikid-env-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deawkoikid-env-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              value: mySuperSecretKeyForJWT12345
            - name: JWT_EXPIRATION
              value: "86400000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
